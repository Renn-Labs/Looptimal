# loop-spec.yaml — first-30-minutes teaching example.
# Instructional budget, not a measured completion-time claim.
# Four atoms + guardrails. The runnable contract lives in run_demo.sh.
# This demo is a controlled maker/verifier demonstration; independent
# product approval is outside the embedded subprocess.

schema_version: 1
slug: first-30-minutes
created: 2026-07-15
pattern: morty

# --- Atom 1: Goal -----------------------------------------------------------
goal: >
  A controlled first attempt is rejected by an external check because its
  source_manifest_sha256 does not match the digest recomputed from the
  immutable source pin, the rejection is recorded in durable state, and the
  next attempt either repairs that invariant and binds the prior RED evidence
  (ACCEPTED), exhausts the retry budget without inventing a pass (EXHAUSTED),
  or stops on a missing/unresolved source pin without fabricating progress
  (BLOCKED).

# --- Atom 2: State ----------------------------------------------------------
state:
  path: examples/first-30-minutes/state.md
  records:
    - attempt number and mode
    - verifier verdict and reason
    - prior-attempt evidence hash (lineage)
    - source-manifest digest binding
    - terminal status when the loop stops
    - outcome receipt digests when ACCEPTED

# --- Atom 3: Verifier (EXTERNAL to the maker step — demo subprocess) --------
# Note: this is the teaching gate inside the example package. Independent
# maker≠checker product review is a separate authority outside this demo.
# The same invariant checks evaluate every attempt (no attempt-number RED).
verifier:
  kind: test
  command: "bash examples/first-30-minutes/verify.sh"
  green_means: >
    the example package is structurally complete and, when a run root is
    supplied, the durable attempt lineage, source pin (local git commit/tree
    object), terminal document (bound to source-pin digests and stop cause),
    and (for ACCEPTED) product outcome receipt are mutually consistent;
    attempt evidence is never treated as an accepted outcome receipt;
    READY/RUNNING and forged terminals fail closed; zero-attempt BLOCKED only
    verifies when a source-pin failure is independently recomputed

# --- Atom 4: Stop conditions -----------------------------------------------
stop:
  success: >
    terminal ACCEPTED after a controlled RED (frozen source-manifest mismatch),
    one honest resume that repairs the digest and binds prior RED evidence, and
    a validated product outcome receipt committed before ACCEPTED state
  max_iterations: 2
  budget:
    tokens: null
    wall_clock_minutes: 30   # instructional operator budget, not wall-time proof
  halt_file: examples/first-30-minutes/HALT

# --- Autonomy & safety ------------------------------------------------------
autonomy: dry-run
human_checkpoints:
  - "do not treat attempt evidence as customer acceptance or an outcome receipt"
  - "do not fall back to an unpinned main branch when the source pin is missing"
  - "do not claim external demand, ship-to-production readiness, or corpus certification"
  - "do not treat this demo's embedded check as independent product approval"
  - "do not claim terminal provenance is external cryptographic authorship"

integrations:
  oh_my_claudecode: false
  subagent_isolation: false
  heavy_orchestrator: false
